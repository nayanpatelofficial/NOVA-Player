name: Build and release NOVA Player

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

  build:
    needs: test
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            os: windows-latest
            kind: windows
            artifact: NOVA-Player-Windows-x64
          - platform: Linux x64
            os: ubuntu-24.04
            kind: portable
            artifact: NOVA-Player-Linux-x64
          - platform: macOS Intel
            os: macos-15-intel
            kind: portable
            artifact: NOVA-Player-macOS-x64
          - platform: macOS Apple silicon
            os: macos-latest
            kind: portable
            artifact: NOVA-Player-macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Install Windows installer compiler
        if: matrix.kind == 'windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows packages
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $env:NOVA_BUILD_PYTHON = (Get-Command python).Source
          .\scripts\build_windows.ps1
          if (-not (Test-Path 'dist\NOVA-Player-Setup.exe')) {
            throw 'The Windows installer was not created.'
          }
          Compress-Archive -Path 'dist\NOVAPlayer', 'README.md' -DestinationPath 'dist\NOVA-Player-Portable.zip' -Force

      - name: Build Linux or macOS package
        if: matrix.kind == 'portable'
        run: python scripts/build_portable.py

      - name: Upload install packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/NOVA-Player-*
          if-no-files-found: error

  android:
    needs: test
    name: Build Android APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux libraries needed by Qt wheel tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdouble-conversion3
      - name: Install host-side Qt for Python and app dependencies
        run: |
          python -m venv "$RUNNER_TEMP/nova-android-venv"
          source "$RUNNER_TEMP/nova-android-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "git+https://github.com/miurahr/aqtinstall.git@8e4ea786f8a4f9dc578516738a137dec80a0362c"
      - name: Install community Qt for host and Android
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/nova-android-venv/bin/activate"
          QT_ROOT="$RUNNER_TEMP/Qt"
          python -m aqt install-qt linux desktop 6.12.0 gcc_64 -O "$QT_ROOT" -m qtmultimedia
          python -m aqt install-qt all_os android 6.12.0 android_arm64_v8a -O "$QT_ROOT" -m qtmultimedia
      - name: Cross-compile open-source PySide6 Android wheels
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/nova-android-venv/bin/activate"
          QT_ROOT="$RUNNER_TEMP/Qt/6.12.0"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK="$SDK/ndk/28.2.13676358"
          test -d "$SDK/platform-tools" || { echo "Android SDK platform-tools are missing"; exit 1; }
          test -d "$SDK/platforms/android-35" || { echo "Android SDK platform android-35 is missing"; exit 1; }
          test -d "$SDK/build-tools/35.0.0" || { echo "Android build-tools 35.0.0 are missing"; exit 1; }
          if [ ! -d "$NDK" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)"
            test -n "$SDKMANAGER" || { echo "Android SDK manager is missing"; exit 1; }
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null
            set -o pipefail
            "$SDKMANAGER" --sdk_root="$SDK" "ndk;28.2.13676358"
          fi
          test -d "$NDK" || { echo "Android NDK 28.2.13676358 could not be installed"; exit 1; }
          git clone --depth 1 --branch 6.12 https://github.com/pyside/pyside-setup.git "$RUNNER_TEMP/pyside-setup"
          cd "$RUNNER_TEMP/pyside-setup"
          python -m pip install -r requirements.txt -r tools/cross_compile_android/requirements.txt
          python tools/cross_compile_android/main.py --plat-name=aarch64 \
            --qt-install-path="$QT_ROOT" --ndk-path="$NDK" --sdk-path="$SDK" \
            --auto-accept-license --skip-update
          PYSIDE_WHEEL="$(find "$RUNNER_TEMP/pyside-setup/dist_android" -maxdepth 1 -iname 'pyside6-*.whl' -print -quit)"
          SHIBOKEN_WHEEL="$(find "$RUNNER_TEMP/pyside-setup/dist_android" -maxdepth 1 -iname 'shiboken6-*.whl' -print -quit)"
          test -n "$PYSIDE_WHEEL" || { echo "PySide6 Android wheel was not downloaded"; exit 1; }
          test -n "$SHIBOKEN_WHEEL" || { echo "Shiboken6 Android wheel was not built"; exit 1; }
          cd "$GITHUB_WORKSPACE"
          pyside6-android-deploy --force --name 'NOVA Player' \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --ndk-path="$NDK" --sdk-path="$SDK"
          mkdir -p dist/android
          APK="$(find . -type f -name '*.apk' -not -path './.git/*' -not -path './.venv/*' -print -quit)"
          test -n "$APK" || { echo "APK output was not found"; exit 1; }
          cp "$APK" dist/android/NOVA-Player-Android-arm64.apk
          sha256sum dist/android/NOVA-Player-Android-arm64.apk
      - uses: actions/upload-artifact@v7
        with:
          name: NOVA-Player-Android-arm64
          path: dist/android/NOVA-Player-Android-arm64.apk
          if-no-files-found: error

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: NOVA-Player-*
          path: release-packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-packages/*

